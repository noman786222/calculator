```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
            text-align: center;
            margin-top: 80px;
        }

        .calculator {
            background-color: white;
            width: 320px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #999;
        }

        h1 {
            color: #2c3e50;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 55px;
            padding: 12px;
            margin: 5px 2px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #21618c;
        }

        #result {
            color: #27ae60;
            font-size: 22px;
            overflow-wrap: anywhere;
        }

        .clear {
            background-color: #e74c3c;
            width: 120px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h1>Calculator</h1>

        <input type="number" id="num1"
               placeholder="Enter first number">

        <input type="number" id="num2"
               placeholder="Enter second number">

        <br>

        <button onclick="calculate('+')">+</button>
        <button onclick="calculate('-')">−</button>
        <button onclick="calculate('*')">×</button>
        <button onclick="calculate('/')">÷</button>

        <h2 id="result">Result: </h2>

        <button class="clear" onclick="clearCalculator()">
            Clear
        </button>
    </div>

    <script>
        function calculate(operator) {
            let input1 = document.querySelector("#num1").value;
            let input2 = document.querySelector("#num2").value;

            if (input1 === "" || input2 === "") {
                document.querySelector("#result").textContent =
                    "Please enter both numbers!";
                return;
            }

            let number1 = Number(input1);
            let number2 = Number(input2);
            let answer;

            if (operator === '+') {
                answer = number1 + number2;
            } 
            else if (operator === '-') {
                answer = number1 - number2;
            } 
            else if (operator === '*') {
                answer = number1 * number2;
            } 
            else if (operator === '/') {
                if (number2 === 0) {
                    document.querySelector("#result").textContent =
                        "Cannot divide by zero!";
                    return;
                }

                answer = number1 / number2;
            }

            document.querySelector("#result").textContent =
                "Result: " + answer;
        }

        function clearCalculator() {
            document.querySelector("#num1").value = "";
            document.querySelector("#num2").value = "";
            document.querySelector("#result").textContent = "Result: ";
        }
    </script>

</body>
</html>
